<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoVault | Admin Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="dashboard">
    <!-- Admin Header -->
    <div class="dashboard-header">
      <h1>👑 Admin Dashboard - EchoVault</h1>
      <div class="profile-icon" style="background: #e74c3c;">A</div>
    </div>

    <!-- Admin Stats -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0;">
      <div class="post" style="text-align: center;">
        <h2 id="totalUsers" style="color: #00e6b8; font-size: 36px;">0</h2>
        <p style="color: #999;">Total Users</p>
      </div>
      <div class="post" style="text-align: center;">
        <h2 id="totalMemories" style="color: #00e6b8; font-size: 36px;">0</h2>
        <p style="color: #999;">Total Memories</p>
      </div>
    </div>

    <!-- All Users Section -->
    <div style="margin-top: 40px;">
      <h2>👥 All Users</h2>
      <div id="usersList" style="margin-top: 20px;"></div>
    </div>

    <!-- All Memories Section -->
    <div style="margin-top: 40px;">
      <h2>📚 All Memories</h2>
      <div id="allMemoriesFeed" style="margin-top: 20px;"></div>
    </div>

    <!-- Logout Button -->
    <button onclick="logout()" style="margin-top: 30px; background: #e74c3c;">Logout</button>
  </div>

  <script>
    // Load admin data on page load
    loadAdminData();

    // Load Admin Data Function
    async function loadAdminData() {
      try {
        // Load Users
        const usersResponse = await fetch('http://localhost:5000/api/admin/users');
        const usersData = await usersResponse.json();
        
        // Load All Memories
        const memoriesResponse = await fetch('http://localhost:5000/api/memories/all');
        const memoriesData = await memoriesResponse.json();

        // Update stats
        document.getElementById('totalUsers').textContent = usersData.users ? usersData.users.length : 0;
        document.getElementById('totalMemories').textContent = memoriesData.memories ? memoriesData.memories.length : 0;

        // Display Users
        displayUsers(usersData.users || []);
        
        // Display All Memories
        displayAllMemories(memoriesData.memories || []);

      } catch (error) {
        console.error('Error loading admin data:', error);
        alert('❌ Failed to load admin data');
      }
    }

    // Display Users
    function displayUsers(users) {
      const usersList = document.getElementById('usersList');
      
      if (users.length > 0) {
        usersList.innerHTML = users.map(user => `
          <div class="post">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <h3 style="color: #00e6b8; margin-bottom: 5px;">${user.name}</h3>
                <p style="color: #ccc; margin-bottom: 5px;">📧 ${user.email}</p>
                <small style="color: #999;">Role: ${user.role || 'user'}</small>
              </div>
              <button onclick="deleteUser('${user._id}', '${user.email}')" style="padding: 8px 16px; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer;">Delete User</button>
            </div>
          </div>
        `).join('');
      } else {
        usersList.innerHTML = '<div class="post"><p style="color: #999; text-align: center;">No users found</p></div>';
      }
    }

    // Display All Memories
    function displayAllMemories(memories) {
      const feed = document.getElementById('allMemoriesFeed');
      
      if (memories.length > 0) {
        feed.innerHTML = memories.map(memory => `
          <div class="post">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
              <div style="flex: 1;">
                <h3 style="color: #00e6b8; margin-bottom: 5px;">${memory.title}</h3>
                <p style="color: #999; font-size: 14px; margin-bottom: 10px;">By: ${memory.userName} (${memory.userEmail})</p>
              </div>
              <button onclick="deleteMemory('${memory._id}')" style="padding: 6px 14px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px;">Delete</button>
            </div>
            <p style="margin-bottom: 10px; line-height: 1.6;">${memory.content}</p>
            <small style="color: #999;">Posted on ${new Date(memory.createdAt).toLocaleDateString()}</small>
          </div>
        `).join('');
      } else {
        feed.innerHTML = '<div class="post"><p style="color: #999; text-align: center;">No memories found</p></div>';
      }
    }

    // Delete User Function
    async function deleteUser(userId, userEmail) {
      if (!confirm(`Are you sure you want to delete user: ${userEmail}?`)) return;
      
      try {
        const response = await fetch(`http://localhost:5000/api/admin/users/${userId}`, {
          method: 'DELETE'
        });
        
        if (response.ok) {
          alert('✅ User deleted successfully!');
          loadAdminData(); // Reload data
        } else {
          const data = await response.json();
          alert('❌ ' + data.message);
        }
      } catch (error) {
        console.error('Error deleting user:', error);
        alert('❌ Failed to delete user');
      }
    }

    // Delete Memory Function
    async function deleteMemory(memoryId) {
      if (!confirm('Are you sure you want to delete this memory?')) return;
      
      try {
        const response = await fetch(`http://localhost:5000/api/memories/${memoryId}`, {
          method: 'DELETE'
        });
        
        if (response.ok) {
          alert('✅ Memory deleted successfully!');
          loadAdminData(); // Reload data
        } else {
          alert('❌ Failed to delete memory');
        }
      } catch (error) {
        console.error('Error deleting memory:', error);
        alert('❌ Failed to delete memory');
      }
    }

    // Logout Function
    function logout() {
      localStorage.clear();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
