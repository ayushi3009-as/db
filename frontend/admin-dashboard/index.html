<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - EchoVault</title>
</head>
<body>
  <h1>Admin Login</h1>

  <form id="adminLoginForm">
    <input type="email" id="adminEmail" placeholder="Email" required /><br>
    <input type="password" id="adminPassword" placeholder="Password" required /><br>
    <button type="submit">Login</button>
  </form>

  <div id="adminSection" style="display:none;">
    <h2>Welcome Admin</h2>
    <button id="loadUsers">Load All Users</button>
    <div id="usersList"></div>
  </div>

  <script>
    document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("adminEmail").value;
      const password = document.getElementById("adminPassword").value;

      try {
        const res = await fetch("http://localhost:5000/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (res.ok) {
          alert("✅ Login successful!");
          document.getElementById("adminLoginForm").style.display = "none";
          document.getElementById("adminSection").style.display = "block";
        } else {
          alert("❌ " + data.message);
        }
      } catch (err) {
        alert("⚠️ Error connecting to server");
      }
    });

    // Load users on button click
    document.getElementById("loadUsers").addEventListener("click", async () => {
      const res = await fetch("http://localhost:5000/api/admin/users");
      const users = await res.json();
      document.getElementById("usersList").innerHTML = users
        .map(u => `<p>${u.name} - ${u.email}</p>`)
        .join("");
    });
  </script>
</body>
</html>
